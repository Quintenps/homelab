---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: image-refresh
  namespace: default
spec:
  schedule: "0 3 * * *" 
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: image-refresh
          automountServiceAccountToken: true
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1001
          containers:
            - name: kubectl
              image: bitnami/kubectl:latest
              securityContext:
                allowPrivilegeEscalation: false
              command:
                - /bin/sh
                - /scripts/image-refresh.sh
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: logs
                  mountPath: /logs
          volumes:
            - name: script
              configMap:
                name: image-refresh-script
            - name: logs
              persistentVolumeClaim:
                claimName: image-refresh-logs

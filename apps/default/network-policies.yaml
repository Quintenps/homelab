apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-wireguard-to-media
spec:
  podSelector:
    matchLabels:
      app: wireguard
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media
    - to:
        - podSelector:
            matchLabels:
              app: homepage

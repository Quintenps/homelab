apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: beszel-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beszel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beszel
  template:
    metadata:
      labels:
        app: beszel
    spec:
      automountServiceAccountToken: false
      containers:
        - name: beszel
          image: henrygd/beszel:latest
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8090
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            exec:
              command:
                - /beszel
                - health
                - --url
                - http://127.0.0.1:8090
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            exec:
              command:
                - /beszel
                - health
                - --url
                - http://127.0.0.1:8090
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /beszel
                - health
                - --url
                - http://127.0.0.1:8090
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /beszel_data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: beszel-data
---
apiVersion: v1
kind: Service
metadata:
  name: beszel
spec:
  type: LoadBalancer
  selector:
    app: beszel
  ports:
    - name: http
      port: 8090
      targetPort: http
